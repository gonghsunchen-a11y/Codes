<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111827; }
      .label { font: 600 24px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #111827; }
      .small { font: 500 20px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #374151; }
      .formula { font: 600 24px "Consolas", "Microsoft JhengHei", monospace; fill: #111827; }
      .note { font: 500 19px "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="54" text-anchor="middle" class="title">單一球門備援定位：用球門固定座標反推機器人位置</text>

  <!-- Field -->
  <rect x="210" y="95" width="780" height="520" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
  <line x1="210" y1="355" x2="990" y2="355" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="600" y1="95" x2="600" y2="615" stroke="#15803d" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="600" cy="355" r="9" fill="#111827"/>
  <text x="618" y="348" class="label">球場中心 O = (0, 0)</text>

  <!-- Goals -->
  <rect x="485" y="105" width="230" height="34" rx="6" fill="#fde047" stroke="#a16207" stroke-width="4"/>
  <text x="600" y="92" text-anchor="middle" class="label">黃色球門 Y = (0, L·S)</text>

  <rect x="485" y="571" width="230" height="34" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="4"/>
  <text x="600" y="642" text-anchor="middle" class="label">藍色球門 B = (0, -L·S)</text>

  <!-- Robot -->
  <circle cx="735" cy="430" r="23" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
  <text x="766" y="438" class="label">機器人 R = (xᵣ, yᵣ)</text>

  <!-- Vector from center to robot -->
  <line x1="600" y1="355" x2="720" y2="422" stroke="#16a34a" stroke-width="6" marker-end="url(#arrowGreen)"/>
  <text x="622" y="410" class="small" fill="#16a34a">機器人場上座標</text>
  <text x="622" y="435" class="formula" fill="#16a34a">(xᵣ, yᵣ)</text>

  <!-- Vector from robot to yellow goal -->
  <line x1="735" y1="430" x2="615" y2="145" stroke="#dc2626" stroke-width="6" marker-end="url(#arrowRed)"/>
  <text x="760" y="275" class="small" fill="#dc2626">看到黃色球門時</text>
  <text x="760" y="302" class="formula" fill="#dc2626">球門相對機器人 = (xᵧ, yᵧ)</text>

  <!-- Vector from robot to blue goal -->
  <line x1="735" y1="430" x2="650" y2="570" stroke="#2563eb" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <text x="778" y="522" class="small" fill="#2563eb">看到藍色球門時</text>
  <text x="778" y="549" class="formula" fill="#2563eb">球門相對機器人 = (xᵦ, yᵦ)</text>

  <!-- Formula panel -->
  <rect x="80" y="635" width="1040" height="95" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="110" y="673" class="formula">球門場上座標 = 機器人場上座標 + 球門相對機器人座標</text>
  <text x="110" y="710" class="formula">所以：機器人場上座標 = 球門場上座標 - 球門相對機器人座標</text>

  <!-- Side formula labels -->
  <rect x="65" y="130" width="340" height="142" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="90" y="170" class="label">只看到黃色球門</text>
  <text x="90" y="207" class="formula">(xᵣ, yᵣ) = (0, L·S) - (xᵧ, yᵧ)</text>
  <text x="90" y="244" class="formula">xᵣ = -xᵧ,  yᵣ = L·S - yᵧ</text>

  <rect x="65" y="438" width="340" height="142" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="90" y="478" class="label">只看到藍色球門</text>
  <text x="90" y="515" class="formula">(xᵣ, yᵣ) = (0, -L·S) - (xᵦ, yᵦ)</text>
  <text x="90" y="552" class="formula">xᵣ = -xᵦ,  yᵣ = -L·S - yᵦ</text>

  <!-- Axis -->
  <line x1="1015" y1="560" x2="1015" y2="465" stroke="#111827" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1015" y1="560" x2="1110" y2="560" stroke="#111827" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1122" y="568" class="small">+X</text>
  <text x="1000" y="448" class="small">+Y</text>
</svg>
