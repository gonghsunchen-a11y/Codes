<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrowRed" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#dc2626"/></marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#16a34a"/></marker>
    <style>
      .title{font:800 36px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111827}
      .subtitle{font:600 23px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#4b5563}
      .label{font:700 24px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#111827}
      .small{font:600 20px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#374151}
      .tiny{font:500 17px "Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;fill:#4b5563}
      .formula{font:700 24px Consolas,"Microsoft JhengHei",monospace;fill:#111827}
      .formulaSmall{font:700 20px Consolas,"Microsoft JhengHei",monospace;fill:#111827}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="title">4.3.6 單一球門備援定位</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">只看到一座球門時，用「球門固定場上座標」減掉「球門相對機器人座標」，反推出機器人位置。</text>

  <rect x="235" y="130" width="930" height="520" rx="24" fill="#dcfce7" stroke="#15803d" stroke-width="5"/>
  <line x1="235" y1="390" x2="1165" y2="390" stroke="#15803d" stroke-width="3" stroke-dasharray="12 9"/>
  <line x1="700" y1="130" x2="700" y2="650" stroke="#15803d" stroke-width="3" stroke-dasharray="12 9"/>
  <circle cx="700" cy="390" r="10" fill="#111827"/>
  <text x="720" y="382" class="label">球場中心 O</text>
  <text x="720" y="410" class="formulaSmall">(0, 0)</text>

  <rect x="560" y="145" width="280" height="38" rx="7" fill="#fde047" stroke="#a16207" stroke-width="4"/>
  <text x="700" y="125" text-anchor="middle" class="label">黃色球門固定座標：Y = (0, L·S)</text>
  <rect x="560" y="597" width="280" height="38" rx="7" fill="#60a5fa" stroke="#1d4ed8" stroke-width="4"/>
  <text x="700" y="680" text-anchor="middle" class="label">藍色球門固定座標：B = (0, -L·S)</text>

  <circle cx="855" cy="465" r="26" fill="#ef4444" stroke="#991b1b" stroke-width="5"/>
  <text x="890" y="460" class="label">機器人 R</text>
  <text x="890" y="488" class="formulaSmall">(xᵣ, yᵣ)</text>
  <line x1="700" y1="390" x2="855" y2="465" stroke="#16a34a" stroke-width="8" marker-end="url(#arrowGreen)"/>
  <text x="730" y="528" class="small" fill="#16a34a">要求的結果：機器人場上座標</text>
  <text x="730" y="557" class="formulaSmall" fill="#16a34a">(xᵣ, yᵣ)</text>

  <line x1="855" y1="465" x2="715" y2="185" stroke="#dc2626" stroke-width="7" marker-end="url(#arrowRed)"/>
  <text x="910" y="270" class="small" fill="#dc2626">只看到黃色球門</text>
  <text x="910" y="299" class="formulaSmall" fill="#dc2626">相對座標 = (xᵧ, yᵧ)</text>
  <text x="910" y="328" class="tiny">從機器人指向黃門</text>
  <line x1="855" y1="465" x2="720" y2="596" stroke="#2563eb" stroke-width="7" marker-end="url(#arrowBlue)"/>
  <text x="910" y="586" class="small" fill="#2563eb">只看到藍色球門</text>
  <text x="910" y="615" class="formulaSmall" fill="#2563eb">相對座標 = (xᵦ, yᵦ)</text>

  <rect x="72" y="158" width="405" height="160" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
  <text x="100" y="202" class="label">黃色球門可見</text>
  <text x="100" y="242" class="formulaSmall">(xᵣ, yᵣ) = (0, L·S) - (xᵧ, yᵧ)</text>
  <text x="100" y="282" class="formulaSmall">xᵣ = -xᵧ</text>
  <text x="250" y="282" class="formulaSmall">yᵣ = L·S - yᵧ</text>
  <rect x="72" y="462" width="405" height="160" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="100" y="506" class="label">藍色球門可見</text>
  <text x="100" y="546" class="formulaSmall">(xᵣ, yᵣ) = (0, -L·S) - (xᵦ, yᵦ)</text>
  <text x="100" y="586" class="formulaSmall">xᵣ = -xᵦ</text>
  <text x="250" y="586" class="formulaSmall">yᵣ = -L·S - yᵦ</text>

  <line x1="1090" y1="565" x2="1090" y2="480" stroke="#111827" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1090" y1="565" x2="1175" y2="565" stroke="#111827" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1187" y="572" class="small">+X</text>
  <text x="1075" y="463" class="small">+Y</text>

  <rect x="110" y="705" width="1180" height="145" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="145" y="750" class="formula">球門場上座標 = 機器人場上座標 + 球門相對機器人座標</text>
  <text x="145" y="792" class="formula">機器人場上座標 = 球門場上座標 - 球門相對機器人座標</text>
  <text x="145" y="834" class="tiny">L：球場中心到單側球門中心的距離，S：依攻守方向切換球門正負方向。</text>
</svg>
